<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuissApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option:hover {
            transform: scale(1.02);
            transition: transform 0.2s;
        }

        .correct {
            background-color: #86efac !important;
        }

        .wrong {
            background-color: #fca5a5 !important;
        }
    </style>
</head>

<body class="bg-gray-300 min-h-screen flex items-center justify-center">
    <div class="container mx-auto p-4 max-w-2xl">
        <div id="startScreen" class="text-center bg-white p-8 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold mb-4 text-gray-600">Kuis Seru</h1>
            <p class="text-gray-400 mb-6">Tes pengetahuan Anda dengan kuis ini!</p>
            <button onclick="startQuiz()"
                class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-full transition-all">
                Mulai Kuis
            </button>
        </div>

        <div id="quizSection" class="hidden bg-gray-100 p-8 rounded-lg shadow-lg">
            <div class="flex justify-between items-center mb-6">
                <div class="text-gray-500">
                    Soal <span id="currentQuestion">1</span>/<span id="totalQuestions">5</span>
                </div>
                <div class="text-purple-700 font-bold" id="score">
                    Skor: 0
                </div>
            </div>

            <div class="mb-6 h-2 bg-gray-200 rounded-full">
                <div id="progressBar" class="h-2 bg-green-700 rounded-full transition-all duration-500"
                    ></div>
            </div>

            <h2 id="question" class="text-xl font-semibold mb-6"></h2>

            <div id="options" class="space-y-4">
            </div>
        </div>

        <!-- Hasil -->
        <div id="resultSection" class="hidden text-center bg-white p-8 rounded-lg shadow-lg max-w-sm mx-auto">
            <h2 class="text-2xl font-bold mb-4 text-gray-700">Selesai!</h2>
            <p class="text-xl mb-6">Skor Akhir: <span id="finalScore" class="font-bold">0</span></p>
            <div class="flex gap-2">
                <button onclick="restartQuiz()"
                    class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-full transition-all">
                    Main Lagi
                </button>
                <button id="logoutBtn" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-full transition-all">
                    Logout
                </button>
            </div>          
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
